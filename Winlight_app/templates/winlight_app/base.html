<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Winlight Studios | High-End Production{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* ---------- SHARED NAV BASE STYLES ---------- */
        .navbar { 
            padding: 1.25rem 2rem; 
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(10,10,10,0.98) 0%, rgba(10,10,10,0.85) 80%, transparent 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .navbar-brand { 
            font-family: 'Playfair Display', serif; 
            font-weight: 900; 
            letter-spacing: 2px; 
            text-decoration: none; 
            color: #ffffff !important;
        }
        
        .reel-tag {
            color: #ffffff !important; 
            font-size: 11px; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.05); 
            padding: 8px 20px; 
            border-radius: 50px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none; 
            transition: all 0.3s ease;
            display: inline-block;
        }
        .reel-tag:hover { 
            background: #ffffff !important; 
            color: #000000 !important; 
            transform: translateY(-2px); 
        }

        /* HARD-CODED HIGH CONTRAST HAMBURGER TOGGLER DESIGN */
        .navbar-toggler {
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            padding: 6px 10px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .navbar-toggler:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.7) !important;
        }
        .navbar-toggler:focus {
            box-shadow: none !important;
        }
        
        /* CUSTOM WHITE 3-LINE SVG INJECTION */
        .custom-white-burger {
            display: inline-block;
            width: 1.5em;
            height: 1.5em;
            vertical-align: middle;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 1%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100%;
        }

        /* MOBILE DROP-DOWN RE-ALIGNMENTS */
        @media (max-width: 991.98px) {
            .navbar {
                padding: 1rem 1.5rem;
                background: rgba(10, 10, 10, 0.98) !important;
            }
            .navbar-collapse {
                background: #0d0d0d;
                margin-top: 1rem;
                padding: 1.5rem;
                border-radius: 12px;
                border: 1px solid #1f1f1f;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            }
            .nav-item-wrapper {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 1rem !important;
                width: 100%;
            }
            .reel-tag {
                width: 100%;
                text-align: center;
                padding: 12px 0;
                font-size: 12px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid p-0">
            <a class="navbar-brand" href="{% url 'studio_home' %}">WINLIGHT</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#winlightNavbarDropdown" aria-controls="winlightNavbarDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="custom-white-burger"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="winlightNavbarDropdown">
                <div class="ms-auto d-flex gap-2 gap-md-3 align-items-center nav-item-wrapper">
                    <a href="{% url 'recent_archive' %}" class="reel-tag">Portfolio Vault</a>
                    <a href="{% url 'pipeline_archive' %}" class="reel-tag">Upcoming Slate</a>
                    <a href="{% url 'crew_archive' %}" class="reel-tag">Crew Roster</a>
                    <a href="{% url 'editorial_archive' %}" class="reel-tag">Editorial Vault</a>
                </div>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
